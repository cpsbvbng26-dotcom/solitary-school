name: 検査

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 読むだけで足りる。書き込みの権限は、要る仕事にだけ名指しで渡す。
permissions:
  contents: read

jobs:
  check:
    name: 本文が自分と食い違わないか 38 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: node verification/check_text.js
